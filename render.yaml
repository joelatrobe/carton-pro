services:
  - type: web
    name: carton-pro
    runtime: node
    # Free tier. The filesystem is writable but not persistent, so articles
    # and uploaded pictures reset to whatever ships in content/ on every
    # deploy. Move to `plan: starter` and add a `disk:` block to keep them.
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # Writable on the free tier, but wiped on each deploy.
      - key: DATA_DIR
        value: /opt/render/project/data

      # Signs the admin session cookie. Render generates it once and keeps it,
      # so a restart does not sign the client out mid-article.
      - key: SESSION_SECRET
        generateValue: true

      # Paste the scrypt hash printed by `node tools/hash-password.js`.
      # The password itself is never stored anywhere.
      - key: ADMIN_PASSWORD_HASH
        sync: false

      - key: SITE_ORIGIN
        value: https://www.rhoward.co.uk

      - key: ENQUIRY_TO
        value: enquiries@rhoward.co.uk

      # Without SMTP the enquiry still saves and the visitor still gets a
      # success message; it just does not email anyone.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ENQUIRY_FROM
        sync: false
