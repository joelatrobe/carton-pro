services:
  - type: web
    name: carton-pro
    runtime: node
    # Starter. Paid for by the client. The disk below is what makes articles,
    # vacancies and uploaded pictures survive a deploy, so the two go together:
    # drop to `free` and the disk goes with it, taking the content with it.
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true

    disk:
      name: disk
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      # Must stay inside the disk mountPath above, or the content is written
      # to the container filesystem and lost on the next deploy.
      - key: DATA_DIR
        value: /var/data

      # Signs the admin session cookie. Render generates it once and keeps it,
      # so a restart does not sign the client out mid-article.
      - key: SESSION_SECRET
        generateValue: true

      # Paste the scrypt hash printed by `node tools/hash-password.js`.
      # The password itself is never stored anywhere.
      - key: ADMIN_PASSWORD_HASH
        sync: false

      # 2, because Render fronts every service with its own Cloudflare, so
      # there are two hops, not one. At 1, req.ip resolved to the Cloudflare
      # edge node rather than the visitor, and since consecutive requests land
      # on different edges the per-IP sign-in throttle never counted past a
      # few. Verified on the live site: at 2 the real address is recorded, and
      # a forged X-Forwarded-For is ignored, because Cloudflare and Render each
      # append the address they actually saw.
      - key: TRUST_PROXY_HOPS
        value: 2

      # Gates /signature.html. Separate from ADMIN_PASSWORD_HASH on purpose:
      # everyone needs a signature, almost nobody needs the article manager.
      # Paste the hash from `node tools/hash-password.js`.
      - key: SIGNATURE_PASSWORD_HASH
        sync: false

      - key: SITE_ORIGIN
        value: https://www.cartonpro.co.uk

      - key: ENQUIRY_TO
        value: hello@cartonpro.co.uk

      # Without SMTP the enquiry still saves and the visitor still gets a
      # success message; it just does not email anyone.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ENQUIRY_FROM
        sync: false
